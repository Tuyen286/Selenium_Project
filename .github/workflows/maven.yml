name: Java CI/CD with Maven

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

  # Enable manual workflow trigger with custom input parameters on GitHub UI
  workflow_dispatch:
    inputs:
      testList:
        description: 'Enter test list filename (e.g., run-list.txt). Leave blank to run the full suite:'
        required: false
        default: ''
        type: string

jobs:
  build:
    runs-on: ubuntu-latest

    # Add permission
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      # Checkout repository source code
      - uses: actions/checkout@v4

      # Set up Java Development Kit (JDK 21) and cache Maven dependencies
      - name: Set up JDK 26
        uses: actions/setup-java@v4
        with:
          java-version: '26'
          distribution: 'temurin'
          cache: maven

      # Execute Maven tests dynamically based on whether testList input is provided
      - name: Run Tests with Maven
        run: |
          if [ -n "${{ github.event.inputs.testList }}" ]; then
            echo "Running filtered tests from: ${{ github.event.inputs.testList }}"
            mvn clean test -DtestList="${{ github.event.inputs.testList }}"
          else
            echo "No testList provided -> Running full regression suite"
            mvn clean test
          fi

      # Archive and upload logs and screenshots regardless of test execution status
      - name: Upload Logs and screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports-and-logs
          path: |
            allure-results
            logs
            screenshots
          retention-days: 3

      # Fetch previous Allure test history from the gh-pages branch (continue on error if branch doesn't exist yet)
      - name: Get Allure History
        uses: actions/checkout@v4
        if: always()
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages

      # Generate the comprehensive HTML Allure Report from raw results and history
      - name: Generate Allure Report
        uses: simple-elf/allure-report-action@master
        if: always()
        id: allure-report
        with:
          allure_results: allure-results
          gh_pages: gh-pages
          allure_report: allure-report
          keep_reports: 20

      # Publish and deploy the generated Allure Report to GitHub Pages branch
      - name: Deploy Allure Report to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        if: always()
        with:
          personal_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: allure-report
          publish_branch: gh-pages
          keep_files: true